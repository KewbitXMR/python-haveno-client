name: Build & Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build sdist & wheel
        run: |
          python -m build

      # Optional: quick sanity check of wheel METADATA before publishing
      - name: Show wheel METADATA (debug)
        run: |
          python - <<'PY'
          import zipfile, glob
          for whl in glob.glob('dist/*.whl'):
              print('Inspecting', whl)
              with zipfile.ZipFile(whl) as z:
                  metas = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
                  if metas:
                      print(z.read(metas[0]).decode().splitlines()[:12])
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.10.3
        with:
          packages-dir: dist
          # skip-existing: true  # uncomment to avoid failing when files already exist

      # ---- If you need to publish to TestPyPI instead, use this step instead of the one above ----
      # - name: Publish to TestPyPI (Trusted Publishing)
      #   uses: pypa/gh-action-pypi-publish@v1.10.3
      #   with:
      #     packages-dir: dist
      #     repository-url: https://test.pypi.org/legacy/
